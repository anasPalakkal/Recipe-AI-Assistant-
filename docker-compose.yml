services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recipeai
      POSTGRES_PASSWORD: recipeai
      POSTGRES_DB: recipeai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipeai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://recipeai:recipeai@postgres:5432/recipeai?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: local-dev-secret-change-in-real-envs-00000000
      COOKIE_DOMAIN: localhost
      NODE_ENV: development
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  postgres_data:
